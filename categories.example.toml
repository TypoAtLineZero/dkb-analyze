Transportation = ["db vertrieb", "deutsche bahn", "bvg", "mvg", "fahrrad", "aral", "shell"]
Subscriptions = ["netflix", "spotify", "disney"]
Insurance = ["versicherung"]
Entertainment = ["konzert", "kino", "ticket"]
Shopping = ["paypal", "amazon", "zalando"]
