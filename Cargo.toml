[package]
name = "dkb-analyze"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Analyze bank account exports (CSV) from German DKB: monthly balances, category breakdowns and a terminal dashboard."
readme = "README.md"
homepage = "https://github.com/TypoAtLineZero/dkb-analyze"
repository = "https://github.com/TypoAtLineZero/dkb-analyze"
keywords = ["dkb", "banking", "finance", "csv", "tui"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.3.1"
ratatui = "0.30.2"
thiserror = "2.0.21"
toml = { version = "1.2.1", features = ["preserve_order"] }
